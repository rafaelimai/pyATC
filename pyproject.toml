[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyatc"
version = "0.1.0"
description = "Experimental simplified aircraft and ATC simulation core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pyatc-calibrate = "calibration:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["aircraft", "airport", "airspace", "autopilot", "calibration", "pid"]
